version: "3.9"

services:
  web:
    build:
      context: .
      args:
        PYTHON_VERSION: 3.14.0
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - .:/app:delegated

  worker:
    build:
      context: .
      args:
        PYTHON_VERSION: 3.14.0
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - .:/app:delegated

  beat:
    build:
      context: .
      args:
        PYTHON_VERSION: 3.14.0
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - .:/app:delegated

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storyteller}
      POSTGRES_USER: ${POSTGRES_USER:-storyteller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyteller}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
